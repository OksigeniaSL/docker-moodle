version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # The PHP linter follows the PHP of the image (8.4): only its patches.
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
