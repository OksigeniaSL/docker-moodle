# Scans the whole git history for secrets (Gitleaks, pinned by digest in
# ci/Dockerfile, so its image is checked against that digest on pull).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (whole history)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            "$(.github/scripts/tool-image.sh gitleaks)" git --redact --verbose --exit-code 1 /repo
