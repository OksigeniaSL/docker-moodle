# Weekly build of Moodle's main branch (the next major release, now 6.0dev)
# for Oksigenia's own test site. It is not a release of the image: it goes
# to a separate package, ghcr.io/oksigeniasl/moodle-dev, kept private, and
# never to oksigenia/moodle. It is pushed only after a fresh install and an
# upgrade from the newest stable branch pass.
name: Moodle main build

on:
  schedule:
    # Tuesdays, after Moodle's weekly builds of Monday. GitHub starts
    # scheduled runs hours late and sometimes drops them, so Wednesday is a
    # second chance, skipped when the week's build is already there.
    - cron: '17 3 * * 2'
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-build
  cancel-in-progress: false

env:
  DEV_IMAGE: ghcr.io/oksigeniasl/moodle-dev

jobs:
  # A scheduled run builds only when nothing was pushed in the last 36 hours,
  # so a late Tuesday run, Wednesday's or one launched by hand count once.
  due:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.last.outputs.build }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          build=true
          if [ "${EVENT}" = schedule ]; then
            # If the package cannot be read, it builds: a second build in a
            # week is better than none.
            last="$(gh api --paginate /orgs/OksigeniaSL/packages/container/moodle-dev/versions \
              --jq '.[].created_at' | sort | tail -1)" \
              || { echo "::warning::could not read the package's versions"; last=""; }
            if [ -n "${last}" ] && [ $(( $(date +%s) - $(date -d "${last}" +%s) )) -lt $(( 36 * 3600 )) ]; then
              build=false
              echo "Skipped: the last build was pushed at ${last}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

  build:
    needs: due
    if: needs.due.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The commit of main, the checksum of its archive and its release name.
      - id: src
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/moodle/moodle.git refs/heads/main | cut -f1)"
          url="https://github.com/moodle/moodle/archive/${sha}.tar.gz"
          curl -fsSL --retry 5 -o "${RUNNER_TEMP}/main.tgz" "${url}"
          sum="$(sha256sum "${RUNNER_TEMP}/main.tgz" | cut -d' ' -f1)"
          release="$(tar -xzOf "${RUNNER_TEMP}/main.tgz" "moodle-${sha}/public/version.php" \
            | sed -n "s/^\$release *= *'\([^']*\)'.*/\1/p")"
          name="${release%% *}"
          build="$(sed -n 's/.*Build: \([0-9]*\).*/\1/p' <<< "${release}")"
          tag="${name}-${build}-${sha:0:7}"
          php=8.4
          {
            echo "tag=${tag}"
            echo "name=${name}"
            echo "release=${release}"
            echo 'args<<EOF'
            echo "PHP_VERSION=${php}"
            echo "PHP_IMAGE=php:${php}-apache-trixie@$(jq -r --arg p "${php}" '.php_images[$p]' versions.json)"
            echo "MOODLE_VERSION=${name} (${sha:0:7})"
            echo "MOODLE_SHA256=${sum}"
            echo "MOODLE_TGZ_URL=${url}"
            echo "ACCESS_VERSION=$(jq -r '.access.version' versions.json)"
            echo "ACCESS_SHA256=$(jq -r '.access.sha256' versions.json)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Moodle ${release}, main at ${sha}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: ${{ steps.src.outputs.args }}
          tags: moodle-dev:test
          load: true
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,mode=max,scope=main-amd64

      - name: Fresh install
        env:
          IMAGE: moodle-dev:test
        run: tests/run.sh install-pgsql

      - name: Upgrade from the newest stable branch
        env:
          IMAGE: moodle-dev:test
        run: |
          IMAGE_OLD="ghcr.io/oksigeniasl/moodle:$(jq -r '.latest' versions.json)" tests/run.sh upgrade

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          TAG: ${{ steps.src.outputs.tag }}
          NAME: ${{ steps.src.outputs.name }}
        run: |
          set -euo pipefail
          for t in "${TAG}" "${NAME}"; do
            docker tag moodle-dev:test "${DEV_IMAGE}:${t}"
            docker push --quiet "${DEV_IMAGE}:${t}"
          done
          echo "Pushed ${DEV_IMAGE}:${TAG} (also ${DEV_IMAGE}:${NAME})" >> "$GITHUB_STEP_SUMMARY"
