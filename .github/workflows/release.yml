# Builds every supported branch for amd64 and arm64 on native runners,
# tests and scans each image before it reaches a registry, then publishes
# multi-arch images to GHCR and Docker Hub, signed with cosign (keyless)
# and carrying SBOM and provenance attestations.
#
# Runs weekly to pick up base image and PHP fixes, on changes to main, and
# by hand. Publishing is off until the repository variable PUBLISH_ENABLED
# is "true"; Docker Hub also needs the DOCKERHUB_TOKEN secret.
name: Release

on:
  push:
    branches: [main]
    paths: [Dockerfile, rootfs/**, versions.json, .github/workflows/release.yml, .github/scripts/**]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/oksigeniasl/moodle
  HUB_IMAGE: docker.io/oksigenia/moodle

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.m.outputs.branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        run: echo "branches=$(jq -c '[.branches | to_entries[] | select(.value.pending != true) | .key]' versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.matrix.outputs.branches) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: args
        run: .github/scripts/build-args.sh "${{ matrix.branch }}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ steps.args.outputs.args }}
          pull: true
          load: true
          tags: moodle-test:${{ matrix.branch }}
          cache-from: type=gha,scope=release-${{ matrix.branch }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.branch }}-${{ matrix.platform.arch }}

      - name: Test (MariaDB)
        env: { IMAGE: "moodle-test:${{ matrix.branch }}" }
        run: tests/run.sh install-mariadb
      - name: Test (PostgreSQL)
        env: { IMAGE: "moodle-test:${{ matrix.branch }}" }
        run: tests/run.sh install-pgsql

      - name: Vulnerability scan (blocks on fixable critical issues)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
            aquasec/trivy:latest image --scanners vuln --severity CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore.yaml --exit-code 1 --no-progress "moodle-test:${{ matrix.branch }}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          build-args: ${{ steps.args.outputs.args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.date.outputs.now }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.branch }}-${{ matrix.platform.arch }}
      - name: Save digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.push.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.branch }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [matrix, build]
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.matrix.outputs.branches) }}
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.branch }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_HUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: oksigenia
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/tags.sh "${{ matrix.branch }}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch images
        id: manifest
        run: |
          set -euo pipefail
          sources=()
          for f in "${{ runner.temp }}"/digests/*; do sources+=("${GHCR_IMAGE}@$(cat "$f")"); done
          registries=("${GHCR_IMAGE}")
          [ "${HAS_HUB}" = true ] && registries+=("${HUB_IMAGE}")
          for registry in "${registries[@]}"; do
            args=()
            for tag in ${{ steps.tags.outputs.tags }}; do args+=(-t "${registry}:${tag}"); done
            docker buildx imagetools create "${args[@]}" "${sources[@]}"
          done
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.tags.outputs.immutable }}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${{ steps.tags.outputs.tags }} (${digest})" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign (cosign keyless)
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${{ steps.manifest.outputs.digest }}"
          if [ "${HAS_HUB}" = true ]; then cosign sign --yes "${HUB_IMAGE}@${{ steps.manifest.outputs.digest }}"; fi

      - name: GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  hub-readme:
    needs: publish
    runs-on: ubuntu-24.04
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.HAS_HUB == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: oksigenia
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: oksigenia/moodle
          short-description: "Maintained Moodle™ LMS image: 4.5 LTS, 5.2, 5.3 LTS. Signed, SBOM, amd64/arm64. Bitnami drop-in."
          readme-filepath: ./README.md
          enable-url-completion: true
