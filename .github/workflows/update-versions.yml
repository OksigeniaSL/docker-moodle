# Regular check for new Moodle point releases and Oksigenia Access releases.
#
# Opens a pull request with the update, runs the full CI on it and merges
# it when CI passes, then starts the release. When CI fails, the pull
# request stays open with a comment. A new Moodle branch opens an issue,
# because adding or retiring a branch is a maintainer's decision.
name: Update versions

on:
  schedule:
    # Every 6 hours, so a Moodle release is picked up the day it ships.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The current main, not the commit of the event: a run queued behind
      # another (concurrency) must see what that one merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: check
        run: .github/scripts/update-versions.sh >> "$GITHUB_OUTPUT"

      - name: Pull request, CI and merge
        if: steps.check.outputs.changed == 'yes'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          set -euo pipefail
          branch="update/$(echo "${SUMMARY}" | tr -cs 'A-Za-z0-9.' '-' | sed 's/-$//' | tr 'A-Z' 'a-z')"
          if [ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "A pull request for ${SUMMARY} is already open"; exit 0
          fi
          git config user.name "Oksigenia SL"
          git config user.email "dev@oksigenia.com"
          git switch -c "${branch}"
          git commit -am "Update to ${SUMMARY}"
          git push --force origin "${branch}"
          pr="$(gh pr create --base main --head "${branch}" --title "Update to ${SUMMARY}" \
            --body "Automatic update of \`versions.json\`. Moodle packages are checked against the SHA-256 that Moodle publishes; for Oksigenia Access it is the SHA-256 of the release tag's archive. It is merged automatically when the full CI passes." \
            | sed 's#.*/##')"

          # Pull requests opened with GITHUB_TOKEN start no workflows: dispatch CI and wait for it.
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run ci.yml --ref "${branch}"
          run=""
          for _ in $(seq 1 30); do
            run="$(gh run list --workflow ci.yml --branch "${branch}" --event workflow_dispatch \
              --created ">=${before}" --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "${run}" ] && break
            sleep 10
          done
          [ -n "${run}" ] || { echo "CI run not found"; exit 1; }
          url="$(gh run view "${run}" --json url --jq .url)"

          ci=passed
          gh run watch "${run}" --exit-status --interval 60 > /dev/null || ci=failed

          # GitHub also creates a pull_request run for a bot's pull request, held for an
          # approval nobody gives; it shows as failed once the PR closes. CI ran above.
          gh run list --workflow ci.yml --branch "${branch}" --event pull_request --status action_required \
            --json databaseId --jq '.[].databaseId' | xargs -r -n1 gh run delete || true

          if [ "${ci}" = passed ]; then
            gh pr merge "${pr}" --squash --delete-branch
            gh workflow run release.yml --ref main
            echo "Merged and released ${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "${pr}" --body "CI failed, so this update was not merged: ${url}"
            exit 1
          fi

      - name: Issue for a new Moodle branch
        if: steps.check.outputs.newbranch != ''
        env:
          NEWBRANCH: ${{ steps.check.outputs.newbranch }}
        run: |
          title="Moodle ${NEWBRANCH} is out: add it to versions.json"
          count="$(gh issue list --state all --search "in:title \"${title}\"" --json number --jq 'length')"
          [ "${count}" = 0 ] || exit 0
          gh issue create --title "${title}" --body "Moodle ${NEWBRANCH}.0 has been released. Add the branch to \`versions.json\` (PHP version, SHA-256), decide whether it becomes \`latest\`/\`lts\`, and retire the branch that leaves security support."
