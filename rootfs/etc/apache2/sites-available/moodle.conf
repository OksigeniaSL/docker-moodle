<VirtualHost *:${APACHE_HTTP_PORT}>
    Include /etc/apache2/moodle-vhost.inc
</VirtualHost>

<IfDefine MOODLE_HTTPS>
    <VirtualHost *:${APACHE_HTTPS_PORT}>
        Include /etc/apache2/moodle-vhost.inc
        SSLEngine on
        SSLCertificateFile ${MOODLE_TLS_CERT}
        SSLCertificateKeyFile ${MOODLE_TLS_KEY}
    </VirtualHost>
</IfDefine>
